services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://Admin:Admin123@sj-postgres:5432/sjs_db
      PORT: 4000
      REDIS_URL: redis://sj-redis:6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-g7V3sx0kA4L9Pq2R8cUfHyXwZtBnV4d1}
      AUTH_TOKEN_TTL_SECONDS: 3600
      CORS_ORIGINS: http://localhost:5173
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-TME}
      BOOTSTRAP_ORGANIZATION_SLUG: ${BOOTSTRAP_ORGANIZATION_SLUG:-stan-jay}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-stanjaysolutions@gmail.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin123}
      STAN_JAY_API_URL: ${STAN_JAY_API_URL:-http://host.docker.internal:3000/api}
      STAN_JAY_API_KEY: ${STAN_JAY_API_KEY:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      INTEGRATION_ENCRYPTION_KEY_ID: ${INTEGRATION_ENCRYPTION_KEY_ID:-local-v1}
      PIPELINE_QUEUE_DRIVER: redis
      PIPELINE_WORKER_CONCURRENCY: 4
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - backend_uploads:/usr/src/app/uploads
    networks:
      - sjs_shared

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - '127.0.0.1:5173:80'
    networks:
      - sjs_shared

  worker:
    profiles: ['p1']
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    expose:
      - '5000'
    networks:
      - sjs_shared

volumes:
  backend_uploads:

networks:
  sjs_shared:
    external: true
    name: sjs_shared
